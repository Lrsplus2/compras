<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="110"/>

  <!-- Document/Sheet with checkmark -->
  <g transform="translate(100, 80)">
    <!-- Sheet background -->
    <rect x="0" y="0" width="280" height="320" fill="#ffffff" rx="12" opacity="0.95"/>

    <!-- Sheet lines (subtle) -->
    <line x1="20" y1="60" x2="260" y2="60" stroke="#e0e7ff" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="100" x2="260" y2="100" stroke="#e0e7ff" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="140" x2="260" y2="140" stroke="#e0e7ff" stroke-width="8" stroke-linecap="round"/>

    <!-- Checkmark circle -->
    <circle cx="200" cy="220" r="50" fill="#10b981" opacity="0.9"/>

    <!-- Checkmark -->
    <path d="M 180 220 L 195 235 L 225 205" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Optional: Shopping bag outline below -->
  <g transform="translate(160, 320)">
    <!-- Bag body -->
    <path d="M 30 20 L 40 80 Q 40 95 50 95 L 130 95 Q 140 95 140 80 L 150 20 Z"
          fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- Bag handle -->
    <path d="M 50 20 Q 90 -10 130 20"
          fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>