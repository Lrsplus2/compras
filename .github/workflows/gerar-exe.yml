name: Gerar sincronizar_base.exe
on:
  workflow_dispatch:
  push:
    paths: ['sincronizar_base.py']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name sincronizar_base sincronizar_base.py
      - uses: actions/upload-artifact@v4
        with:
          name: sincronizar_base_exe
          path: dist/sincronizar_base.exe
